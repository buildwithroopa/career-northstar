<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Career Compass — Career workspace</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--ink:#172033;--muted:#68738a;--line:#e2e7f0;--accent:#2458d3;--accent2:#e9efff;--green:#13795b;--amber:#9a6200;--shadow:0 8px 30px rgba(25,42,75,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:#111b31;color:#fff;padding:25px 16px;display:flex;flex-direction:column;gap:24px}.brand{font-size:20px;font-weight:800;letter-spacing:-.5px;padding:0 10px}.brand small{display:block;color:#aebbd4;font-size:12px;font-weight:500;letter-spacing:0;margin-top:3px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#cbd5e7;text-align:left;padding:11px 12px;border-radius:10px;display:flex;gap:11px;align-items:center}.nav button.active,.nav button:hover{background:#263653;color:#fff}.sidebar-note{margin-top:auto;color:#aebbd4;font-size:12px;padding:10px}.main{min-width:0}.topbar{height:72px;background:rgba(255,255,255,.88);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:2;backdrop-filter:blur(10px)}.topbar .eyebrow{font-size:12px;color:var(--muted)}.content{max-width:1200px;margin:0 auto;padding:30px 32px 60px}.pagehead{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:24px}.pagehead h1{margin:0;font-size:29px;letter-spacing:-.8px}.pagehead p{color:var(--muted);margin:7px 0 0}.pill{border-radius:99px;background:#edf2ff;color:#214db2;padding:5px 10px;font-size:12px;font-weight:700}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;color:var(--ink);font-weight:650}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.danger{color:#a32828}.btn.small{padding:6px 9px;font-size:12px}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.two{grid-template-columns:1.25fr .75fr}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);min-width:0}.stat-label{color:var(--muted);font-size:13px}.stat-value{font-size:29px;font-weight:800;letter-spacing:-.8px;margin-top:5px}.stat-foot{color:var(--muted);font-size:12px;margin-top:3px}.card h2{font-size:17px;margin:0 0 14px;letter-spacing:-.3px}.card h3{font-size:15px;margin:0 0 7px}.muted{color:var(--muted)}.smalltext{font-size:12px;color:var(--muted)}.row{display:flex;gap:12px;align-items:center}.between{justify-content:space-between}.stack{display:grid;gap:12px}.task{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid #edf0f6}.task:last-child{border-bottom:0}.task input{margin-top:4px;accent-color:var(--accent)}.task.done .task-title{text-decoration:line-through;color:#8791a4}.task-title{font-weight:650}.task-desc{font-size:12px;color:var(--muted);margin-top:2px}.progress{height:7px;background:#edf0f6;border-radius:99px;overflow:hidden}.progress span{height:100%;display:block;background:var(--accent);border-radius:99px}.empty{padding:25px 15px;text-align:center;color:var(--muted);border:1px dashed #d4dbe8;border-radius:12px}.empty strong{display:block;color:var(--ink);margin-bottom:5px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}.toolbar input{flex:1;min-width:180px}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea,.toolbar input{width:100%;border:1px solid #dce2ed;border-radius:9px;padding:10px 11px;background:#fff;color:var(--ink)}.field textarea{min-height:85px;resize:vertical}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.span2{grid-column:1/-1}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}.listitem{padding:14px 0;border-bottom:1px solid #edf0f6}.listitem:last-child{border-bottom:0}.listitem p{margin:5px 0;color:var(--muted);font-size:13px}.tag{display:inline-block;background:#f0f3f8;color:#58647a;border-radius:6px;padding:3px 7px;font-size:11px;margin:3px 3px 0 0}.status{font-size:11px;font-weight:750;border-radius:99px;padding:4px 8px;background:#edf2ff;color:#2851ad}.notice{padding:13px 14px;border-radius:11px;background:#f0f5ff;border:1px solid #dce7ff;color:#274478;font-size:13px}.warning{background:#fff8e8;border-color:#f2e1b8;color:#735016}.modalback{position:fixed;inset:0;background:rgba(15,25,45,.45);display:grid;place-items:center;padding:20px;z-index:5}.modal{background:#fff;border-radius:17px;width:min(650px,100%);max-height:90vh;overflow:auto;padding:23px;box-shadow:0 25px 90px #0b153344}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h2{margin:0}.close{border:0;background:#f1f3f8;border-radius:8px;padding:5px 10px}.workstreams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stream{border:1px solid var(--line);border-radius:12px;padding:13px;text-align:left;background:#fff}.stream.selected{border-color:var(--accent);background:var(--accent2);box-shadow:inset 0 0 0 1px var(--accent)}.stream strong{display:block;margin-bottom:4px}.stream span{font-size:12px;color:var(--muted)}.footnote{font-size:12px;color:var(--muted);line-height:1.6}.hidden{display:none!important}.toast{position:fixed;bottom:20px;right:20px;background:#15233c;color:#fff;padding:12px 17px;border-radius:10px;box-shadow:var(--shadow);z-index:9}.hero{background:linear-gradient(120deg,#152847,#234a89);color:#fff;border-radius:17px;padding:24px;margin-bottom:18px}.hero p{color:#d2def3;max-width:620px}.hero .btn{border-color:#ffffff55;background:#ffffff12;color:#fff}.hero h2{font-size:24px;margin:0}.barlabel{display:flex;justify-content:space-between;font-size:12px;margin:8px 0;color:var(--muted)}
@media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{padding:12px;gap:12px}.brand{padding:5px}.brand small,.sidebar-note{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px}.topbar{position:static;padding:0 18px}.content{padding:22px 16px 45px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.two,.three{grid-template-columns:1fr}.pagehead h1{font-size:25px}}
@media(max-width:520px){.formgrid,.workstreams{grid-template-columns:1fr}.span2{grid-column:auto}.pagehead{display:block}.pagehead .btn{margin-top:14px}.card{padding:16px}}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar">
  <div class="brand">✦ Career Compass<small>Your career, organized.</small></div>
  <nav class="nav" id="nav">
    <button class="active" data-page="Home">⌂ <span>Home</span></button>
    <button data-page="Study Tracker">▤ <span>Study Tracker</span></button>
    <button data-page="Prep Tracker">◎ <span>Prep Tracker</span></button>
    <button data-page="Interview Tracker">▦ <span>Interview Tracker</span></button>
    <button data-page="Network">♧ <span>Network</span></button>
    <button data-page="Checklist">☷ <span>Checklist</span></button>
    <button data-page="Settings">⚙ <span>Privacy & Settings</span></button>
  </nav>
  <div class="sidebar-note">A flexible workspace for every career direction.<br><br>🔒 Your prototype data stays in this browser.</div>
</aside>
<main class="main">
<header class="topbar"><div><div class="eyebrow">CAREER WORKSPACE</div><strong id="topTitle">Home</strong></div><div class="row"><span class="pill" id="streamBadge">Choose workstream</span><button class="btn small" id="quickAdd">＋ Add</button></div></header>
<div class="content" id="content"></div>
</main>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const STORE='career-compass-mvp-v1';
const streams=[
['Software & Engineering','Frontend, backend, full-stack, mobile, platform, DevOps, SRE'],
['AI & Data','AI engineering, ML, research, data science, analytics, FDE'],
['Product & Design','Product, program management, UX/UI, research, technical writing'],
['Business & Operations','Strategy, business analysis, operations, finance, consulting'],
['Customer & Commercial','Sales, solutions engineering, customer success, partnerships'],
['Marketing & Communications','Growth, product marketing, content, communications, brand'],
['People & Talent','Recruiting, HR, people operations, learning and development'],
['Specialized & Other','Healthcare, legal, education, research, cybersecurity, other']
];
const seedTasks=[
['Define target role(s)','Choose one or more titles and seniority levels.','Career direction'],
['Review your current resume','Identify evidence, strengths and gaps for your target role.','Positioning'],
['Update your professional profile','Align headline, summary and experience with your goals.','Positioning'],
['Build a target-company list','Prioritize companies and roles by fit.','Job search'],
['Reach out to 3 professional connections','Ask for perspective, advice or an informational conversation.','Network'],
['Prepare a concise career introduction','Practice a clear 30-second version.','Interview readiness'],
['Schedule focused learning time','Choose a skill gap and define a practical exercise.','Learning'],
['Create a weekly review','Review progress and set realistic next actions.','Planning']
];
let state=load();
function fresh(){return {profile:{name:'',workstreams:[],targetRoles:'',seniority:'',goal:'Find a new role',timeline:'Flexible',hours:'5–10 hours',location:'US',experience:'',notes:''},tasks:seedTasks.map((x,i)=>({id:id(),title:x[0],description:x[1],category:x[2],done:false,priority:i<3?'High':'Normal',due:''})),study:[],prep:[],jobs:[],contacts:[],settings:{}}}
function load(){try{let x=JSON.parse(localStorage.getItem(STORE));return x&&x.profile?x:fresh()}catch(e){return fresh()}}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));document.getElementById('streamBadge').textContent=state.profile.workstreams.length?state.profile.workstreams.length+' workstream'+(state.profile.workstreams.length>1?'s':''):'Choose workstream';return true}catch(e){toast('Could not save. Export your data and check browser storage.');return false}}
function id(){return Math.random().toString(36).slice(2,10)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){let r=document.getElementById('toastRoot');r.innerHTML='<div class="toast">'+esc(s)+'</div>';setTimeout(()=>r.innerHTML='',2600)}
function page(name){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===name));document.getElementById('topTitle').textContent=name;render(name)}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)page(b.dataset.page)});
document.getElementById('quickAdd').onclick=()=>openAdd();
function header(title,sub,action=''){return `<div class="pagehead"><div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`}
function card(title,body,extra=''){return `<section class="card ${extra}"><h2>${title}</h2>${body}</section>`}
function empty(title,desc,btn=''){return `<div class="empty"><strong>${title}</strong>${desc}${btn?'<div style="margin-top:12px">'+btn+'</div>':''}</div>`}
function button(label,act,primary=false){return `<button class="btn ${primary?'primary':''}" data-act="${act}">${label}</button>`}
function render(name='Home'){
 const root=document.getElementById('content');
 const done=state.tasks.filter(t=>t.done).length;
 const stream=state.profile.workstreams.join(', ')||'No workstream selected';
 if(name==='Home'){
 root.innerHTML=header('Your career workspace','A calm, organized place to move toward your next goal.',button('Personalize my path','profile',true))+`
 <div class="hero"><div class="eyebrow" style="color:#cbdaf5">YOUR NEXT CHAPTER</div><h2>${state.profile.targetRoles?esc(state.profile.targetRoles):'Build a path toward your next opportunity'}</h2><p>${state.profile.workstreams.length?'Workstream: '+esc(stream):'Start by choosing your workstream. We’ll tailor your preparation around the role you want.'} Set a realistic pace and let your plan evolve as you do.</p>${button('Choose workstream','profile')}</div>
 <div class="grid stats">
 ${stat('Checklist progress',done+'/'+state.tasks.length,`${state.tasks.length?Math.round(done/state.tasks.length*100):0}% complete`)}
 ${stat('Study items',state.study.length,'Learning plan')}
 ${stat('Active opportunities',state.jobs.filter(j=>!['Rejected','Withdrawn','Offer accepted'].includes(j.stage)).length,'Interview tracker')}
 ${stat('Network connections',state.contacts.length,'People and leads')}
 </div>
 <div class="grid two">
 ${card('Your next actions',state.tasks.filter(t=>!t.done).slice(0,5).map(t=>`<div class="task"><input type="checkbox" data-task="${t.id}"><div><div class="task-title">${esc(t.title)}</div><div class="task-desc">${esc(t.category)} · ${esc(t.priority)} priority</div></div></div>`).join('')||empty('You’re all caught up','Add a task when you are ready.'))}
 ${card('A simple weekly rhythm',`<div class="listitem"><strong>Build</strong><p>Study one relevant skill and produce evidence of practice.</p></div><div class="listitem"><strong>Connect</strong><p>Have a genuine conversation with a peer, mentor or recruiter.</p></div><div class="listitem"><strong>Apply</strong><p>Prioritize a small number of well-matched opportunities.</p></div><div class="listitem"><strong>Reflect</strong><p>Review what worked and adjust next week’s plan.</p></div>`)}
 </div><p class="footnote" style="margin-top:18px">Your workspace is saved in this browser. Use Privacy & Settings to export a backup. This prototype does not yet provide account-based cloud sync.</p>`;
 } else if(name==='Study Tracker'){
 root.innerHTML=header('Study Tracker','Build skills with practice that matches your target role.',button('＋ Add study item','add:study',true))+`<div class="notice">Tip: track evidence of mastery, not just time spent. Link each item to a practical exercise or project.</div><div class="grid three" style="margin-top:16px">${stat('Planned items',state.study.length,'Learning queue')}${stat('Completed',state.study.filter(x=>x.status==='Completed').length,'Marked complete')}${stat('Time invested',state.study.reduce((a,x)=>a+(Number(x.minutes)||0),0)+' min','Logged study time')}</div>${card('Your learning plan',state.study.length?state.study.map(x=>itemCard(x,'study')).join(''):empty('Your learning plan starts here','Add a skill, resource, exercise and target role.',button('Add first study item','add:study',true)))}`;
 } else if(name==='Prep Tracker'){
 root.innerHTML=header('Prep Tracker','Get your profile, materials and role research ready.',button('＋ Add prep item','add:prep',true))+`<div class="grid two">${card('Career positioning',`<div class="listitem"><strong>Resume review</strong><p>Compare your current resume with target roles. Keep all claims factual and verifiable.</p>${button('Add resume task','add:prep')}</div><div class="listitem"><strong>Professional profile</strong><p>Refine headline, summary, achievements and featured work.</p>${button('Add profile task','add:prep')}</div><div class="listitem"><strong>Role and company research</strong><p>Save job descriptions, required skills, product notes and questions.</p>${button('Add research task','add:prep')}</div><div class="listitem"><strong>Portfolio / proof of work</strong><p>Plan a work sample that reflects your chosen discipline.</p>${button('Add portfolio task','add:prep')}</div>`)}${card('Your prep items',state.prep.length?state.prep.map(x=>itemCard(x,'prep')).join(''):empty('No prep items yet','Add your first preparation task.'))}</div>`;
 } else if(name==='Interview Tracker'){
 root.innerHTML=header('Interview Tracker','Track opportunities from saved role to decision.',button('＋ Add opportunity','add:job',true))+`<div class="grid stats">${stat('Saved / applied',state.jobs.filter(j=>['Saved','Applied'].includes(j.stage)).length,'Early pipeline')}${stat('Interviewing',state.jobs.filter(j=>['Recruiter screen','Interviewing','Final round'].includes(j.stage)).length,'Active conversations')}${stat('Offers',state.jobs.filter(j=>j.stage==='Offer').length,'Offer stage')}${stat('Closed',state.jobs.filter(j=>['Rejected','Withdrawn','Offer accepted'].includes(j.stage)).length,'Closed outcomes')}</div>${card('Your opportunities',state.jobs.length?`<div class="toolbar"><input id="jobSearch" placeholder="Search company or role…"><select id="stageFilter"><option value="">All stages</option>${['Saved','Applied','Recruiter screen','Interviewing','Final round','Offer','Offer accepted','Rejected','Withdrawn'].map(s=>`<option>${s}</option>`).join('')}</select></div><div id="jobList">${state.jobs.map(x=>itemCard(x,'job')).join('')}</div>`:empty('Your pipeline starts here','Save a role, track a referral, and keep the next action visible.',button('Add an opportunity','add:job',true)))}`;
 } else if(name==='Network'){
 root.innerHTML=header('Network','Keep track of people, relationships, introductions and leads.',button('＋ Add connection','add:contact',true))+`<div class="grid stats">${stat('Connections',state.contacts.length,'People and organizations')}${stat('Follow-ups due',state.contacts.filter(c=>c.followup&&!c.done).length,'Your next actions')}${stat('Referrals / leads',state.contacts.filter(c=>/referral|lead/i.test(c.type||'')).length,'Potential opportunities')}${stat('Conversations',state.contacts.filter(c=>c.lastContact).length,'Interaction history')}</div>${card('Your network',state.contacts.length?`<div class="toolbar"><input id="contactSearch" placeholder="Search name, company or notes…"><select id="contactFilter"><option value="">All connection types</option>${['Former colleague','Recruiter','Hiring manager','Peer','Mentor','Alumni','Referral / lead','Other'].map(s=>`<option>${s}</option>`).join('')}</select></div><div id="contactList">${state.contacts.map(x=>itemCard(x,'contact')).join('')}</div>`:empty('Start with people, not just applications','Add a former colleague, recruiter, mentor, or someone you would like to learn from.',button('Add your first connection','add:contact',true)))}`;
 } else if(name==='Checklist'){
 root.innerHTML=header('Career checklist','A flexible checklist for your career journey. Adapt it to your circumstances.',button('＋ Add task','add:task',true))+`<div class="row between" style="margin-bottom:8px"><span class="muted">${done} of ${state.tasks.length} tasks complete</span><span class="muted">${state.tasks.length?Math.round(done/state.tasks.length*100):0}%</span></div><div class="progress" style="margin-bottom:18px"><span style="width:${state.tasks.length?done/state.tasks.length*100:0}%"></span></div>${card('Your tasks',state.tasks.length?state.tasks.map(t=>`<div class="task ${t.done?'done':''}"><input type="checkbox" data-task="${t.id}" ${t.done?'checked':''}><div style="flex:1"><div class="task-title">${esc(t.title)}</div><div class="task-desc">${esc(t.description)} · ${esc(t.category||'General')}</div>${t.due?`<div class="smalltext">Due ${esc(t.due)}</div>`:''}</div><button class="btn small" data-edit-task="${t.id}">Edit</button></div>`).join(''):empty('No tasks','Add a task to get started.'))}`;
 } else if(name==='Settings'){
 root.innerHTML=header('Privacy & settings','Control your information and keep a portable backup.')+`<div class="grid two">${card('Your data and privacy',`<div class="notice warning"><strong>Prototype storage:</strong> data is saved in this browser’s local storage. It is not uploaded to a server by this app. Anyone with access to this browser profile may be able to access it. Do not use a shared/public device for sensitive information.</div><div class="listitem"><strong>Export your data</strong><p>Download a JSON backup of your profile, tasks, study plan, opportunities and contacts.</p>${button('Export backup','export',true)}</div><div class="listitem"><strong>Import a backup</strong><p>Restore a previously exported JSON file into this browser. Import replaces the current workspace.</p><input type="file" id="importFile" accept="application/json"></div><div class="listitem"><strong>Clear local data</strong><p>Delete the data saved by this prototype from this browser.</p>${button('Clear all local data','clear')}</div>`)}${card('Profile and preferences',`<p class="muted">Workstreams: <strong>${esc(stream)}</strong></p><p class="muted">Target roles: <strong>${esc(state.profile.targetRoles||'Not set')}</strong></p><p class="muted">Goal: <strong>${esc(state.profile.goal||'Not set')}</strong></p>${button('Edit profile and workstreams','profile',true)}<hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h3>Privacy guardrails for a shared production app</h3><ul class="muted" style="padding-left:19px"><li>Individual accounts and secure authentication</li><li>Database row-level security so users only access their own records</li><li>Encryption in transit and at rest</li><li>Explicit consent before sending resume/contact data to AI services</li><li>Data export and deletion controls</li><li>Minimal retention, audit logs and secrets kept server-side</li><li>Never expose private notes or contacts publicly by default</li></ul>`)} </div><p class="footnote" style="margin-top:18px">This prototype provides browser-local persistence and export/import. It is not yet a multi-user cloud service. Before inviting users to enter sensitive information, configure authenticated cloud storage, access controls, backups and a privacy notice.</p>`;
 }
 bindContent(name);
}
function stat(label,value,foot){return `<div class="card"><div class="stat-label">${label}</div><div class="stat-value">${value}</div><div class="stat-foot">${foot}</div></div>`}
function itemCard(x,type){let title=x.title||x.name||x.role||'Untitled';let sub=x.company||x.category||x.type||x.stage||'';let desc=x.description||x.notes||x.next||'';return `<div class="listitem"><div class="row between" style="align-items:flex-start"><div style="min-width:0"><strong>${esc(title)}</strong>${sub?`<div class="smalltext">${esc(sub)}</div>`:''}</div><div class="row"><span class="status">${esc(x.status||x.stage||x.type||'Saved')}</span><button class="btn small" data-edit="${type}:${x.id}">Edit</button><button class="btn small danger" data-delete="${type}:${x.id}">×</button></div></div>${desc?`<p>${esc(desc)}</p>`:''}${x.followup?`<div class="smalltext">Follow-up: ${esc(x.followup)}</div>`:''}${x.url?`<div class="smalltext"><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">Open link ↗</a></div>`:''}${x.tags?`<div>${esc(x.tags).split(',').map(t=>`<span class="tag">${esc(t.trim())}</span>`).join('')}</div>`:''}</div>`}
function bindContent(name){
 document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));
 document.querySelectorAll('[data-task]').forEach(c=>c.onchange=()=>{let t=state.tasks.find(t=>t.id===c.dataset.task);if(t)t.done=c.checked;save();render(name)});
 document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{let [t,i]=b.dataset.edit.split(':');openEdit(t,i)});
 document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{let [t,i]=b.dataset.delete.split(':');if(confirm('Delete this item?')){let key={study:'study',prep:'prep',job:'jobs',contact:'contacts'}[t];if(key)state[key]=state[key].filter(x=>x.id!==i);save();render(name)}});
 document.querySelectorAll('[data-edit-task]').forEach(b=>b.onclick=()=>openEdit('task',b.dataset.editTask));
 let js=document.getElementById('jobSearch'), sf=document.getElementById('stageFilter');if(js)js.oninput=filterJobs;if(sf)sf.onchange=filterJobs;
 let cs=document.getElementById('contactSearch'), cf=document.getElementById('contactFilter');if(cs)cs.oninput=filterContacts;if(cf)cf.onchange=filterContacts;
 let imp=document.getElementById('importFile');if(imp)imp.onchange=importFile;
}
function filterJobs(){let q=(document.getElementById('jobSearch').value||'').toLowerCase(),s=document.getElementById('stageFilter').value;document.getElementById('jobList').innerHTML=state.jobs.filter(x=>(!q||(`${x.company} ${x.role} ${x.notes}`).toLowerCase().includes(q))&&(!s||x.stage===s)).map(x=>itemCard(x,'job')).join('')||empty('No matching opportunities','Try a different search or stage.');bindContent('Interview Tracker')}
function filterContacts(){let q=(document.getElementById('contactSearch').value||'').toLowerCase(),s=document.getElementById('contactFilter').value;document.getElementById('contactList').innerHTML=state.contacts.filter(x=>(!q||(`${x.name} ${x.company} ${x.notes}`).toLowerCase().includes(q))&&(!s||x.type===s)).map(x=>itemCard(x,'contact')).join('')||empty('No matching connections','Try a different search or type.');bindContent('Network')}
function act(a){if(a==='profile')return openProfile();if(a.startsWith('add:'))return openAdd(a.split(':')[1]);if(a==='export')return exportData();if(a==='clear'){if(confirm('Permanently clear all Career Compass data saved in this browser? Export a backup first if you need one.')){localStorage.removeItem(STORE);state=fresh();save();page('Home');toast('Local data cleared.')}return}}
function openProfile(){
 let p=state.profile,sel=p.workstreams||[];
 showModal('Personalize your path',`<form id="profileForm"><div class="field"><label>What should we call you? (optional)</label><input name="name" value="${esc(p.name)}" autocomplete="off"></div><div class="field" style="margin-top:13px"><label>Choose one or more workstreams</label><div class="workstreams">${streams.map(([n,d])=>`<button type="button" class="stream ${sel.includes(n)?'selected':''}" data-stream="${esc(n)}"><strong>${esc(n)}</strong><span>${esc(d)}</span></button>`).join('')}</div><input type="hidden" name="workstreams" value="${esc(sel.join('|'))}"></div><div class="formgrid" style="margin-top:14px"><div class="field span2"><label>Target role(s)</label><input name="targetRoles" value="${esc(p.targetRoles)}" placeholder="e.g. Senior Product Designer, Data Analyst, AI Engineer"></div><div class="field"><label>Seniority</label><select name="seniority">${['Exploring','Entry level','Early career','Mid-level','Senior','Staff / Principal','Manager','Director / Executive','Flexible'].map(v=>`<option ${p.seniority===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Primary goal</label><select name="goal">${['Find a new role','Change disciplines','Return to work','Internal promotion','First job / internship','Move into leadership','Explore options'].map(v=>`<option ${p.goal===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Timeline</label><select name="timeline">${['As soon as possible','Within 1 month','Within 3 months','Within 6 months','Flexible'].map(v=>`<option ${p.timeline===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Time available per week</label><select name="hours">${['1–3 hours','5–10 hours','10–20 hours','20+ hours','Varies'].map(v=>`<option ${p.hours===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field span2"><label>Experience, strengths or constraints (optional)</label><textarea name="experience" placeholder="What have you done, and what would you like help with?">${esc(p.experience)}</textarea></div></div><div class="form-actions"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary">Save profile</button></div></form>`);
 document.querySelectorAll('[data-stream]').forEach(b=>b.onclick=()=>{b.classList.toggle('selected');let selected=[...document.querySelectorAll('[data-stream].selected')].map(x=>x.dataset.stream);document.querySelector('[name=workstreams]').value=selected.join('|')});
 document.getElementById('profileForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);state.profile={...state.profile,name:f.get('name'),workstreams:(f.get('workstreams')||'').split('|').filter(Boolean),targetRoles:f.get('targetRoles'),seniority:f.get('seniority'),goal:f.get('goal'),timeline:f.get('timeline'),hours:f.get('hours'),experience:f.get('experience')};save();closeModal();page('Home');toast('Profile saved in this browser.')};
}
function openAdd(type='task'){let map={study:['Study item','study'],prep:['Prep item','prep'],job:['Opportunity','job'],contact:['Connection','contact'],task:['Checklist task','task']};if(!type)type='task';let info=map[type]||map.task;showForm(type,info[0],null)}
function openEdit(type,i){let key={study:'study',prep:'prep',job:'jobs',contact:'contacts',task:'tasks'}[type];let obj=state[key]?.find(x=>x.id===i);if(obj)showForm(type,'Edit '+({study:'study item',prep:'prep item',job:'opportunity',contact:'connection',task:'task'}[type]),obj)}
function field(label,name,value='',placeholder='',kind='text',opts=[]){if(kind==='select')return `<div class="field"><label>${label}</label><select name="${name}">${opts.map(o=>`<option ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;if(kind==='textarea')return `<div class="field span2"><label>${label}</label><textarea name="${name}" placeholder="${esc(placeholder)}">${esc(value)}</textarea></div>`;return `<div class="field"><label>${label}</label><input type="${kind}" name="${name}" value="${esc(value)}" placeholder="${esc(placeholder)}"></div>`}
function showForm(type,title,obj){
 obj=obj||{};let common=type==='study'?field('Title','title',obj.title,'e.g. Practice SQL joins')+field('Target role / skill','category',obj.category,'Skill or role')+field('Status','status',obj.status||'Not started','','select',['Not started','In progress','Needs review','Completed'])+field('Minutes studied','minutes',obj.minutes||'','30','number')+field('Resource or exercise URL','url',obj.url,'https://…')+field('Notes / evidence','description',obj.description||obj.notes,'What did you practice?','textarea')
 :type==='prep'?field('Task title','title',obj.title,'e.g. Tailor resume for target role')+field('Category','category',obj.category||'Positioning','','select',['Resume','LinkedIn','Role research','Company research','Portfolio','Interview prep','Other'])+field('Status','status',obj.status||'Not started','','select',['Not started','In progress','Completed'])+field('Due date','due',obj.due,'','date')+field('Notes / next step','description',obj.description||obj.notes,'What needs to happen?','textarea')
 :type==='job'?field('Company','company',obj.company,'Company name')+field('Role title','role',obj.role,'Job title')+field('Stage','stage',obj.stage||'Saved','','select',['Saved','Applied','Recruiter screen','Interviewing','Final round','Offer','Offer accepted','Rejected','Withdrawn'])+field('Location / work style','location',obj.location,'Remote, hybrid, city…')+field('Job URL','url',obj.url,'https://…')+field('Next action / follow-up date','followup',obj.followup,'YYYY-MM-DD')+field('Resume version','resumeVersion',obj.resumeVersion,'e.g. Product resume v2')+field('Notes','notes',obj.notes,'Interview notes, compensation, contact, next steps…','textarea')
 :type==='contact'?field('Name','name',obj.name,'Full name')+field('Company','company',obj.company,'Organization')+field('Role','role',obj.role,'Their role')+field('Connection type','type',obj.type||'Other','','select',['Former colleague','Recruiter','Hiring manager','Peer','Mentor','Alumni','Referral / lead','Other'])+field('Last interaction','lastContact',obj.lastContact,'','date')+field('Next follow-up','followup',obj.followup,'','date')+field('LinkedIn / profile URL','url',obj.url,'https://…')+field('Related opportunity','related',obj.related,'Company or role')+field('Notes / conversation history','notes',obj.notes,'How you met, advice, referral status, next action…','textarea')
 :field('Task title','title',obj.title,'What needs to happen?')+field('Category','category',obj.category||'General','','select',['Career direction','Positioning','Job search','Network','Learning','Interview readiness','Planning','General'])+field('Priority','priority',obj.priority||'Normal','','select',['High','Normal','Low'])+field('Due date','due',obj.due,'','date')+field('Description','description',obj.description,'Details or definition of done','textarea');
 showModal(title,`<form id="itemForm"><div class="formgrid">${common}</div><div class="form-actions"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary">Save</button></div></form>`);
 document.getElementById('itemForm').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target).entries());let key={study:'study',prep:'prep',job:'jobs',contact:'contacts',task:'tasks'}[type];if(obj.id){Object.assign(obj,f)}else{state[key].unshift({id:id(),done:false,...f})}save();closeModal();let pg={study:'Study Tracker',prep:'Prep Tracker',job:'Interview Tracker',contact:'Network',task:'Checklist'}[type];page(pg);toast('Saved in this browser.')};
}
function showModal(title,body){document.getElementById('modalRoot').innerHTML=`<div class="modalback" id="modalBack"><div class="modal"><div class="modalhead"><h2>${title}</h2><button class="close" data-close>✕</button></div>${body}</div></div>`;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);document.getElementById('modalBack').onclick=e=>{if(e.target.id==='modalBack')closeModal()}}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function exportData(){let blob=new Blob([JSON.stringify({app:'Career Compass MVP',version:1,exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='career-compass-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Backup exported. Store it somewhere private.')}
function importFile(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result),d=x.data||x;if(!d.profile||!Array.isArray(d.tasks))throw Error('invalid');if(!confirm('Import replaces the workspace currently saved in this browser. Continue?'))return;state=d;save();page('Settings');toast('Backup imported.')}catch(err){alert('Could not import this file. Choose a valid Career Compass JSON backup.')}};r.readAsText(file)}
save();render('Home');
</script>
</body>
</html>
